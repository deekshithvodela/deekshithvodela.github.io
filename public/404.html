<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Page Not Found | Deekshith Vodela</title>
  <meta name="description" content="The page you are looking for does not exist. Return to Deekshith Vodela's graphic design portfolio." />
  <meta name="theme-color" content="#eceef1" />
  <link rel="icon" type="image/png" sizes="48x48" href="/assets/icons/favicon-48.png" />
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <script>
    (function() {
      // Universal Case-Insensitive Router for GitHub Pages
      var path = window.location.pathname;
      var segments = path.split('/').filter(Boolean);
      if (segments.length === 0) return;

      var candidate = segments[0];
      var candidateLower = candidate.toLowerCase();

      // Tier 1: Static dictionary of known repositories
      var KNOWN_REPOS = {
        "canonify": "Canonify",
        "fingerswipe": "FingerSwipe",
        "formsoffline": "FormsOffline",
        "top-dashboard": "top-dashboard"
      };

      function redirectToRepo(targetRepo) {
        var remaining = segments.slice(1).join('/');
        var trailingSlash = path.endsWith('/') ? '/' : '';
        var newPath = '/' + targetRepo + (remaining ? '/' + remaining + trailingSlash : '/');
        var targetUrl = newPath + window.location.search + window.location.hash;
        if (targetUrl !== (window.location.pathname + window.location.search + window.location.hash)) {
          window.location.replace(targetUrl);
          return true;
        }
        return false;
      }

      // Check Tier 1
      if (KNOWN_REPOS[candidateLower]) {
        var target = KNOWN_REPOS[candidateLower];
        // Redirect if casing differs or if missing trailing slash on repo root
        if (candidate !== target || (segments.length === 1 && !path.endsWith('/'))) {
          if (redirectToRepo(target)) return;
        }
      }

      // Tier 2: Dynamic check against GitHub API cache or live fetch for any future repo
      var CACHE_KEY = "gh_pages_repos_v1";
      var cached = null;
      try {
        var stored = sessionStorage.getItem(CACHE_KEY);
        if (stored) cached = JSON.parse(stored);
      } catch (e) {}

      if (cached && typeof cached === 'object') {
        if (cached[candidateLower]) {
          var targetCached = cached[candidateLower];
          if (candidate !== targetCached || (segments.length === 1 && !path.endsWith('/'))) {
            if (redirectToRepo(targetCached)) return;
          }
        }
      } else {
        // Query public GitHub API to discover repositories with GitHub Pages enabled
        document.documentElement.classList.add('checking-route');
        var timer = setTimeout(function() {
          document.documentElement.classList.remove('checking-route');
        }, 1200);

        fetch('https://api.github.com/users/deekshithvodela/repos?per_page=100')
          .then(function(res) { return res.ok ? res.json() : []; })
          .then(function(repos) {
            clearTimeout(timer);
            var repoMap = {};
            if (Array.isArray(repos)) {
              repos.forEach(function(r) {
                if (r && r.name && r.has_pages) {
                  repoMap[r.name.toLowerCase()] = r.name;
                }
              });
              try {
                sessionStorage.setItem(CACHE_KEY, JSON.stringify(repoMap));
              } catch (e) {}
              if (repoMap[candidateLower]) {
                var targetDiscovered = repoMap[candidateLower];
                if (candidate !== targetDiscovered || (segments.length === 1 && !path.endsWith('/'))) {
                  if (redirectToRepo(targetDiscovered)) return;
                }
              }
            }
            document.documentElement.classList.remove('checking-route');
          })
          .catch(function() {
            clearTimeout(timer);
            document.documentElement.classList.remove('checking-route');
          });
      }
    })();
  </script>

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent !important;
      -webkit-tap-highlight-color: rgba(0, 0, 0, 0) !important;
      -webkit-touch-callout: none !important;
    }
    ::selection {
      background: transparent !important;
      color: inherit;
    }
    ::-moz-selection {
      background: transparent !important;
      color: inherit;
    }
    a, button {
      -webkit-tap-highlight-color: transparent !important;
      -webkit-tap-highlight-color: rgba(0, 0, 0, 0) !important;
      -webkit-touch-callout: none !important;
      -webkit-user-select: none !important;
      user-select: none !important;
      touch-action: manipulation;
    }
    *:focus, *:focus-visible, *:active {
      outline: none !important;
      box-shadow: none !important;
    }
    html, body {
      width: 100%;
      height: 100%;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #eceef1;
      color: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      touch-action: manipulation;
    }
    .bg-ambient {
      position: fixed;
      left: -5vw;
      top: -5vh;
      width: 110vw;
      height: 110vh;
      background-image: url('/assets/images/avatar.jpeg');
      background-size: cover;
      background-position: center;
      opacity: 0.25;
      filter: blur(55px);
      pointer-events: none;
      z-index: 0;
    }
    .card {
      position: relative;
      z-index: 2;
      width: 90%;
      max-width: 440px;
      background: #ffffff;
      border-radius: 24px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.1);
      padding: 40px 24px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: opacity 0.2s ease-in-out;
    }
    html.checking-route .card {
      opacity: 0;
      pointer-events: none;
    }
    .avatar-wrapper {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      overflow: hidden;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
      margin-bottom: 20px;
      background: #ffffff;
    }
    .avatar-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }
    p {
      font-size: 14px;
      color: #4b5563;
      line-height: 1.5;
      margin-bottom: 28px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background-color: #000000;
      color: #ffffff;
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
      padding: 14px 28px;
      border-radius: 9999px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), background-color 0.2s;
    }
    .btn:hover {
      background-color: #1f2937;
      transform: translateY(-1px);
    }
    .btn:active {
      transform: translateY(0) scale(0.98);
    }
  </style>
  <!-- Privacy-friendly Web Analytics by GoatCounter -->
  <script data-goatcounter="https://githubio.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>
<body>
  <div class="bg-ambient" aria-hidden="true"></div>
  <main class="card">
    <div class="avatar-wrapper">
      <img src="/assets/images/avatar.jpeg" alt="Deekshith Vodela Logo" />
    </div>
    <h1>404 - Page Not Found</h1>
    <p>The link you followed may be broken, or the page may have been moved.</p>
    <a href="https://deekshithvodela.github.io/" class="btn">Back to Portfolio</a>
  </main>
</body>
</html>
